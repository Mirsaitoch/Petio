basePath: /
definitions:
  domain.Article:
    properties:
      careType:
        type: string
      category:
        type: string
      description:
        type: string
      id:
        type: string
      image:
        type: string
      petType:
        type: string
      readTime:
        type: integer
      title:
        type: string
    type: object
  domain.Chat:
    properties:
      created_at:
        type: string
      id:
        type: string
      last_message:
        allOf:
        - $ref: '#/definitions/domain.ChatMessage'
        description: Не из БД - подгружаем отдельно
      stats:
        $ref: '#/definitions/domain.ChatStats'
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  domain.ChatMessage:
    properties:
      chat_id:
        type: string
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      input_tokens:
        type: integer
      model_used:
        description: AI метаданные
        type: string
      output_tokens:
        type: integer
      question_type:
        type: string
      role:
        description: user, assistant, system
        type: string
      total_tokens:
        type: integer
    type: object
  domain.ChatStats:
    properties:
      chat_id:
        type: string
      last_message_at:
        type: string
      message_count:
        type: integer
      total_input_tokens:
        type: integer
      total_output_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  domain.Comment:
    properties:
      author:
        type: string
      avatar:
        type: string
      content:
        type: string
      id:
        type: string
      timestamp:
        type: string
    type: object
  domain.HealthDiaryEntry:
    properties:
      date:
        type: string
      id:
        type: string
      note:
        type: string
      petId:
        type: string
    type: object
  domain.Pet:
    properties:
      age:
        type: integer
      birthDate:
        type: string
      breed:
        type: string
      features:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      photo:
        type: string
      species:
        type: string
      vaccinations:
        items:
          $ref: '#/definitions/domain.Vaccination'
        type: array
      weight:
        type: number
    type: object
  domain.Post:
    properties:
      author:
        type: string
      avatar:
        type: string
      club:
        type: string
      comments:
        items:
          $ref: '#/definitions/domain.Comment'
        type: array
      content:
        type: string
      id:
        type: string
      image:
        type: string
      liked:
        type: boolean
      likes:
        type: integer
      timestamp:
        type: string
    type: object
  domain.PostsResponse:
    properties:
      has_more:
        description: есть ли еще посты внизу
        type: boolean
      has_new:
        description: есть ли новые посты сверху
        type: boolean
      posts:
        items:
          $ref: '#/definitions/domain.Post'
        type: array
    type: object
  domain.Reminder:
    properties:
      completed:
        type: boolean
      date:
        type: string
      id:
        type: string
      petId:
        type: string
      petName:
        type: string
      time:
        type: string
      title:
        type: string
      type:
        $ref: '#/definitions/domain.ReminderType'
    type: object
  domain.ReminderType:
    enum:
    - feeding
    - vaccination
    - deworming
    - grooming
    type: string
    x-enum-varnames:
    - ReminderFeeding
    - ReminderVaccination
    - ReminderDeworming
    - ReminderGrooming
  domain.Shelter:
    properties:
      category:
        type: string
      city:
        type: string
      description:
        type: string
      founded:
        type: string
      id:
        type: string
      imageURL:
        type: string
      longDescription:
        type: string
      name:
        type: string
      needs:
        items:
          type: string
        type: array
      phone:
        type: string
      tagline:
        type: string
      tags:
        items:
          type: string
        type: array
      website:
        type: string
    type: object
  domain.UserProfile:
    properties:
      avatar:
        type: string
      bio:
        type: string
      joinDate:
        type: string
      name:
        type: string
      petsCount:
        type: integer
      postsCount:
        type: integer
      username:
        type: string
    type: object
  domain.Vaccination:
    properties:
      date:
        type: string
      id:
        type: string
      name:
        type: string
      nextDate:
        type: string
    type: object
  domain.WeightRecord:
    properties:
      date:
        type: string
      weight:
        type: number
    type: object
host: localhost:8080
info:
  contact: {}
  description: API приложения для ухода за домашними животными
  title: Petio API
  version: "1.0"
paths:
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 'status: ok'
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка работоспособности сервиса
      tags:
      - system
  /v1/articles:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Article'
            type: array
      security:
      - BearerAuth: []
      summary: Список статей
      tags:
      - articles
    post:
      consumes:
      - application/json
      parameters:
      - description: статья
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Article'
      security:
      - BearerAuth: []
      summary: Создать статью
      tags:
      - articles
  /v1/articles/{id}:
    delete:
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Удалить статью
      tags:
      - articles
    get:
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Article'
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить статью по ID
      tags:
      - articles
    put:
      consumes:
      - application/json
      parameters:
      - description: ID статьи
        in: path
        name: id
        required: true
        type: string
      - description: данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.Article'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Article'
      security:
      - BearerAuth: []
      summary: Обновить статью
      tags:
      - articles
  /v1/auth/device:
    post:
      consumes:
      - application/json
      parameters:
      - description: device_id
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: token, refreshToken, userId, isNew
          schema:
            additionalProperties: true
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход / авторегистрация по device_id
      tags:
      - auth
  /v1/auth/device/accounts:
    get:
      parameters:
      - description: device_id
        in: query
        name: device_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: accounts
          schema:
            items:
              type: object
            type: array
      summary: Список аккаунтов на устройстве
      tags:
      - auth
  /v1/auth/device/switch:
    post:
      consumes:
      - application/json
      parameters:
      - description: device_id, user_id
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: token, refreshToken
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Переключиться на другой аккаунт на том же устройстве
      tags:
      - auth
  /v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: email
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Запросить сброс пароля
      tags:
      - auth
  /v1/auth/link-email:
    post:
      consumes:
      - application/json
      description: Email и пароль НЕ сохраняются до подтверждения кода через /auth/verify-email
      parameters:
      - description: email, password
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Привязать email — отправляет код верификации на почту
      tags:
      - auth
  /v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: email, password
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: token
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Вход
      tags:
      - auth
  /v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: refreshToken
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: token, refreshToken
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Обновить access token
      tags:
      - auth
  /v1/auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: email, code, new_password
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Сбросить пароль по коду из email
      tags:
      - auth
  /v1/auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: code
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: status
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Подтвердить email кодом из письма
      tags:
      - auth
  /v1/chats:
    get:
      parameters:
      - description: Limit (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Chat'
            type: array
      security:
      - BearerAuth: []
      summary: Список всех чатов пользователя
      tags:
      - chat
    post:
      consumes:
      - application/json
      parameters:
      - description: title (optional)
        in: body
        name: body
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Chat'
      security:
      - BearerAuth: []
      summary: Создать новый чат
      tags:
      - chat
  /v1/chats/{id}:
    delete:
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Удалить чат
      tags:
      - chat
    get:
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Chat'
      security:
      - BearerAuth: []
      summary: Получить чат по ID
      tags:
      - chat
    patch:
      consumes:
      - application/json
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: title
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
      security:
      - BearerAuth: []
      summary: Обновить название чата
      tags:
      - chat
  /v1/chats/{id}/messages:
    get:
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: Limit (default 50)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.ChatMessage'
            type: array
      security:
      - BearerAuth: []
      summary: Получить историю сообщений чата
      tags:
      - chat
    post:
      consumes:
      - application/json
      parameters:
      - description: Chat ID
        in: path
        name: id
        required: true
        type: string
      - description: text
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ChatMessage'
      security:
      - BearerAuth: []
      summary: Отправить сообщение в чат
      tags:
      - chat
  /v1/chats/stats:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.ChatStats'
      security:
      - BearerAuth: []
      summary: Получить общую статистику по чатам
      tags:
      - chat
  /v1/diary/{id}:
    delete:
      parameters:
      - description: ID записи
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Удалить запись дневника
      tags:
      - diary
    get:
      parameters:
      - description: ID записи
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HealthDiaryEntry'
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить запись дневника по ID
      tags:
      - diary
    put:
      consumes:
      - application/json
      parameters:
      - description: ID записи
        in: path
        name: id
        required: true
        type: string
      - description: данные
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.HealthDiaryEntry'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HealthDiaryEntry'
      security:
      - BearerAuth: []
      summary: Обновить запись дневника
      tags:
      - diary
  /v1/pets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Pet'
            type: array
      security:
      - BearerAuth: []
      summary: Список питомцев
      tags:
      - pets
    post:
      consumes:
      - application/json
      parameters:
      - description: питомец
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.Pet'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Pet'
      security:
      - BearerAuth: []
      summary: Добавить питомца
      tags:
      - pets
  /v1/pets/{id}:
    delete:
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Удалить питомца
      tags:
      - pets
    get:
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Pet'
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить питомца по ID
      tags:
      - pets
    put:
      consumes:
      - application/json
      parameters:
      - description: ID питомца
        in: path
        name: id
        required: true
        type: string
      - description: данные питомца
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.Pet'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Pet'
      security:
      - BearerAuth: []
      summary: Обновить питомца
      tags:
      - pets
  /v1/pets/{petId}/diary:
    get:
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.HealthDiaryEntry'
            type: array
      security:
      - BearerAuth: []
      summary: Список записей дневника питомца
      tags:
      - diary
    post:
      consumes:
      - application/json
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      - description: запись
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.HealthDiaryEntry'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.HealthDiaryEntry'
      security:
      - BearerAuth: []
      summary: Создать запись в дневнике
      tags:
      - diary
  /v1/pets/{petId}/weight:
    get:
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.WeightRecord'
            type: array
      security:
      - BearerAuth: []
      summary: Список записей веса питомца
      tags:
      - weight
    post:
      consumes:
      - application/json
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      - description: date, weight
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.WeightRecord'
      produces:
      - application/json
      responses:
        "201":
          description: Created
      security:
      - BearerAuth: []
      summary: Добавить запись веса
      tags:
      - weight
  /v1/pets/{petId}/weight/{date}:
    delete:
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      - description: Дата (YYYY-MM-DD)
        in: path
        name: date
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Удалить запись веса
      tags:
      - weight
    get:
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      - description: Дата (YYYY-MM-DD)
        in: path
        name: date
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.WeightRecord'
        "404":
          description: error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Получить запись веса по дате
      tags:
      - weight
    put:
      consumes:
      - application/json
      parameters:
      - description: ID питомца
        in: path
        name: petId
        required: true
        type: string
      - description: Дата (YYYY-MM-DD)
        in: path
        name: date
        required: true
        type: string
      - description: weight
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.WeightRecord'
      produces:
      - application/json
      responses:
        "200":
