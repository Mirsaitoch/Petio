# Шаблон секретов. Скопируй в secrets.yml и подставь реальные значения.
# secrets.yml в .gitignore — НЕ коммить реальные значения!
# Для прода используй: kubectl create secret generic ... --from-literal=...
# Или sealed-secrets / external-secrets-operator

apiVersion: v1
kind: Secret
metadata:
  name: petio-secrets
  namespace: petio
type: Opaque
stringData:
  # Postgres
  DATABASE_URL: "postgres://postgres:<password>@postgres.petio.svc:5432/petio?sslmode=disable"
  POSTGRES_PASSWORD: "<password>"

  # JWT
  JWT_SECRET: "<jwt-secret>"

  # S3 (Yandex Object Storage)
  S3_BUCKET: "petio-images"
  S3_REGION: "ru-central1"
  S3_ENDPOINT: "https://storage.yandexcloud.net"
  S3_BASE_URL: ""
  AWS_ACCESS_KEY_ID: "<aws-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<aws-secret-access-key>"

  # Yandex AI
  YANDEX_AI_API_KEY: "<yandex-ai-api-key>"
  YANDEX_AI_FOLDER_ID: "<yandex-folder-id>"
  YANDEX_AI_BASE_URL: "https://ai.api.cloud.yandex.net/v1"

  # SMTP
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USERNAME: "<smtp-username>"
  SMTP_PASSWORD: "<smtp-app-password>"
  SMTP_FROM: "<smtp-from>"
